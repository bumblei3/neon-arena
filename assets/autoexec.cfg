// NeonArena mod autoexec — applied when fs_game=neonarena
// Ghost binds live in ghost-binds.cfg (cgame execs that when the kit is on,
// so arena mode keeps mouse2 and the engine's pk3-autoexec skip cannot drop them).
seta sv_maxclients "24"
exec neon-look.cfg
exec neon-gfx.cfg
exec gfx-auto.cfg

// Controller support (v0.80)
seta in_joystick "1"
seta joy_threshold "0.15"
seta joy_sensitivity "2.0"
seta joy_deadzone "0.12"
seta joy_assist "0.3"
bind JOY1 "+attack"
bind JOY2 "+zoom"
bind JOY3 "+button2"
bind JOY4 "+button3"
bind JOY5 "+button4"
bind JOY6 "+button5"
bind JOY7 "+button6"
bind JOY8 "+button7"
bind JOY9 "+button8"
bind JOY10 "+button9"
bind JOY11 "+button10"
bind JOY12 "+button11"
bind JOY13 "+button12"
bind JOY14 "+button13"
bind JOY15 "+button14"
bind JOY16 "+button15"
