// NeonArena optimized graphic + performance defaults.
// Exec'd from autoexec.cfg (after neon-look.cfg). Tuned for a smooth,
// neon-faithful experience on mid/high-end GPUs (e.g. RTX 2070) without
// sacrificing the dark map + glow identity.
//
// Apply order: autoexec -> neon-look.cfg -> neon-gfx.cfg -> gfx-auto.cfg.
// gfx-auto.cfg is written once by scripts/start-quake3e.sh (low/med/high).
// A vid_restart is NOT required for most of these, but r_picmip / r_mode
// changes take effect on the next vid_restart.

// --- performance / memory headroom (Wave-20 + human + bots) ---
seta com_hunkmegs      "256"
seta com_zoneMegs      "64"
seta com_maxfps        "250"     // uncapped-ish; lets the renderer push frames
seta r_swapInterval    "0"       // vsync off -> lowest input latency

// --- texture / mesh quality (lighter loads, same neon look) ---
seta r_picmip          "1"       // 1 step down: faster uploads, still crisp
seta r_roundImagesDown "1"
seta r_simpleMipMaps   "1"
seta r_subdivisions    "4"       // coarser mesh tessellation
seta r_lodCurveError   "2500"    // more aggressive model LOD
seta r_ext_max_anisotropy "4"     // 4x AF: cheap, keeps edges readable
seta r_texturemode     "GL_LINEAR_MIPMAP_LINEAR"

// --- lighting / neon identity (kept from neon-look, re-asserted here) ---
seta r_mapoverbrightbits "1"
seta r_overbrightbits   "1"
seta r_dynamiclight    "1"
seta r_flares          "1"
seta r_vertexlight     "0"
seta r_fastsky         "0"
seta r_picmip          "1"       // re-assert (neon-look sets 0 for crisp neon)

// --- color correction so neon pops on the dark base ---
seta r_gamma           "1.4"

// --- audio (synths loop is light; 22k is plenty, saves a little CPU) ---
seta s_khz             "22050"
seta s_mixahead        "0.05"

echo "^4NeonArena ^7optimized gfx defaults applied"
