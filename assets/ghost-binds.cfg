// Ghost-Kit binds — exec'd from cgame when g_neonwave_ghost 1
// (engine does not exec autoexec.cfg out of a pk3).
bind j "cloak"
bind h "emp"
bind k "lockdown"
bind n "nuke"
bind m "multiscan"
bind l "loadout next"
bind mouse2 "+zoom"
seta cg_zoomfov "28"
// Pad: Linux SDL joystick order (A B X Y LB RB Back Start LS RS). LT/RT are axes.
bind JOY5 "cloak"           // LB
bind JOY6 "emp"             // RB
bind JOY3 "lockdown"        // X
bind JOY4 "nuke"            // Y
bind JOY7 "loadout next"    // Back
bind JOY10 "multiscan"      // RS click — no LT button on this layout
echo "^4Ghost ^7binds: J/LB cloak  H/RB emp  K/X lock  N/Y nuke  M/RS scan  L/Back kit  RMB/B zoom"
