// Ghost-Kit binds — exec'd from cgame when g_neonwave_ghost 1
// (engine does not exec autoexec.cfg out of a pk3).
bind j "cloak"
bind h "emp"
bind k "lockdown"
bind n "nuke"
bind m "multiscan"
bind l "loadout next"
bind mouse2 "+zoom"
seta cg_zoomfov "28"
echo "^4Ghost ^7binds: J cloak  H emp  K lock  N nuke  M scan  L kit  RMB zoom"
