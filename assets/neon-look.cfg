// NeonArena look — darker maps, neon weapons, cyan/magenta identity.
// Exec'd from autoexec.cfg and from cgame. r_mapoverbrightbits needs a vid_restart
// (or a game restart) to fully apply.

seta r_dynamiclight "1"
seta r_flares "1"
seta r_fastsky "0"
seta r_picmip "0"
seta r_vertexlight "0"
seta cg_shadows "1"
seta r_mapoverbrightbits "1"
seta r_overbrightbits "1"

seta cg_railTrailTime "1100"
seta cg_oldRail "0"
seta cg_trueLightning "1"

// Q3 color table: 5=cyan, 6=magenta
seta color1 "5"
seta color2 "6"

// room for wave-20 bots + human (latched — set before map load)
seta sv_maxclients "24"

// spend perk cards between waves (F1/F2/F3 = the three offers)
bind F1 "upgrade 1"
bind F2 "upgrade 2"
bind F3 "upgrade 3"

echo "^4NeonArena ^7look applied"
