// Perk shop — exec'd from cgame every map so autoexec-from-pk3 skip cannot drop them.
// Wave break: three cards. Press the number on the card.
bind 1 "upgrade 1"
bind 2 "upgrade 2"
bind 3 "upgrade 3"
bind F1 "upgrade 1"
bind F2 "upgrade 2"
bind F3 "upgrade 3"
// D-pad left / up / right = cards 1 / 2 / 3 (SDL2 Xbox layout)
bind JOY14 "upgrade 1"
bind JOY12 "upgrade 2"
bind JOY15 "upgrade 3"
echo "^4NeonArena ^7upgrade binds: 1 2 3  (or F1 F2 F3 / D-pad)"
