name: build-setup-exe

on:
  workflow_run:
    workflows: ["build-installer"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-setup:
    runs-on: windows-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download Portable Package
        uses: actions/download-artifact@v7
        with:
          name: neonarena-installer
          path: portable-zip
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id || github.run_id }}

      - name: Extract Portable Package
        shell: bash
        run: |
          # portable-zip/ and installer/ both live directly under the repo root
          ROOT="$GITHUB_WORKSPACE"
          mkdir -p "$ROOT/installer-staging"
          cd portable-zip
          unzip -q *.zip -d "$ROOT/installer-staging"
          cd "$ROOT/installer-staging"
          # ISS expects: engine/ (exe+dlls+baseoa), neonarena/ (pk3s), neonarena.bat
          # tolerate a nested neonarena-engine/ wrapper if one is present
          if [ -d neonarena-engine ]; then
            cd neonarena-engine
          fi
          mkdir -p "$ROOT/installer/engine" "$ROOT/installer/neonarena"
          mv quake3e*.exe quake3e*.dll SDL2*.dll "$ROOT/installer/engine/" 2>/dev/null || true
          mv baseoa "$ROOT/installer/engine/" 2>/dev/null || true
          if [ -d neonarena ]; then
            mv neonarena/*.pk3 "$ROOT/installer/neonarena/" 2>/dev/null || true
          fi
          mv neonarena.bat "$ROOT/installer/" 2>/dev/null || true
          ls -la "$ROOT/installer/engine/"
          test -f "$ROOT/installer/engine/quake3e.exe" || { echo "quake3e.exe missing after extract"; exit 1; }
          test -f "$ROOT/installer/neonarena/neonarena.pk3" || { echo "neonarena.pk3 missing after extract"; exit 1; }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Resolve version
        shell: bash
        run: |
          V=$(grep -m1 'define[[:space:]]*GAMEVERSION' oa-gamecode/code/game/g_local.h \
              | sed -n 's/.*"NeonArena-\(.*\)".*/\1/p')
          [ -n "$V" ] || { echo "GAMEVERSION not found"; exit 1; }
          echo "version=$V" >> "$GITHUB_ENV"
          echo "Mod version: NeonArena-$V"

      - name: Compile Setup.exe
        shell: cmd
        run: |
          set PATH=%PATH%;C:\ProgramData\chocolatey\bin;C:\Program Files (x86)\Inno Setup 6
          iscc /DMyAppVersion=%version% installer\neonarena.iss
          dir installer\*Setup*.exe

      - name: Upload Setup.exe
        uses: actions/upload-artifact@v7
        with:
          name: neonarena-setup-exe
          path: installer/NeonArena-*-Setup.exe

      # workflow_run github.ref is the default branch, never a tag — do not
      # attach the setup exe to a GitHub Release here. Tag releases come
      # from build-mod; the exe is uploaded as a CI artifact for manual
      # attachment.
