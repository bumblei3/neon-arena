name: Prototype SDL2-GL3

on:
  push:
    paths:
      - 'prototypes/sdl2-gl3/**'
      - '.github/workflows/prototype-gl3.yml'
  pull_request:
    paths:
      - 'prototypes/sdl2-gl3/**'
      - '.github/workflows/prototype-gl3.yml'

concurrency:
  group: prototype-gl3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - uses: actions/checkout@v7

    - name: Cache apt packages
      uses: actions/cache@v6
      with:
        path: /var/cache/apt/archives
        key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/prototype-gl3.yml') }}
        restore-keys: apt-${{ runner.os }}-

    - name: Install dependencies
      run: |
        for i in 1 2 3; do
          sudo apt-get -o Acquire::Retries=5 update && \
          sudo apt-get -o Acquire::Retries=5 install -y \
            cmake \
            g++ \
            libgl1-mesa-dev \
            libglew-dev \
            libsdl2-dev \
            libsdl2-mixer-dev && break
          echo "::warning::apt attempt $i failed, retrying"
          sleep $((i * 15))
        done
    
    - name: Configure
      run: |
        cd prototypes/sdl2-gl3
        cmake .
    
    - name: Build
      run: |
        cd prototypes/sdl2-gl3
        make -j$(nproc)
    
    - name: Run tests
      run: |
        cd prototypes/sdl2-gl3
        bash tests/run_tests.sh
