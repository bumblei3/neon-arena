name: engine-quake3e

# Builds the Quake3e engine (OpenGL2 + Vulkan, Bloom) for Linux, Windows and macOS
# as optional binary artifacts. The OpenArena compatibility patch (BASEGAME=baseoa)
# is applied so Quake3e loads OA content directly. BaseOA pk3s are supplied by the
# player (see README) — only the engine binaries are shipped here.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-engine:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsdl2-dev libwayland-dev zip unzip libcurl4-openssl-dev libvulkan-dev glslang-tools

      - name: Setup MSYS2 MINGW64 (Windows)
        if: matrix.platform == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: minimal
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-make mingw-w64-x86_64-SDL2 zip

      - name: Install build dependencies (macOS)
        if: matrix.platform == 'macos'
        run: |
          brew install sdl2 vulkan-headers molten-vk
          # universal binaries: build for both arches
          echo "ARCH=universal" >> $GITHUB_ENV

      - name: Clone Quake3e (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: git clone --depth 1 https://github.com/ec-/quake3e.git "$GITHUB_WORKSPACE/quake3e"

      - name: Clone Quake3e (Linux/macOS)
        if: matrix.platform != 'windows'
        run: git clone --depth 1 https://github.com/ec-/quake3e.git /tmp/quake3e

      - name: Apply OpenArena compatibility (skip id-pak checksum check)
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "windows" ]; then
            QUAKE3E_DIR="$(cygpath -u "$GITHUB_WORKSPACE")/quake3e"
          else
            QUAKE3E_DIR="/tmp/quake3e"
          fi
          cd "$QUAKE3E_DIR"
          # Replace BASEGAME value for OpenArena compatibility (use perl for cross-platform \t support)
          perl -pi -e 's/^#define BASEGAME.*/#define BASEGAME\t\t\t"baseoa"/' code/qcommon/q_shared.h
          # sdl_glimp.c uses Win32 clipboard APIs; make the include explicit.
          if [ -f code/sdl/sdl_glimp.c ]; then
            perl -pi -e 's/^void Sys_SetClipboardBitmap.*$/#ifdef _WIN32\n#include <windows.h>\n#endif\n$&/' code/sdl/sdl_glimp.c
          fi

      - name: Build engine (Linux)
        if: matrix.platform == 'linux'
        run: make -C /tmp/quake3e ARCH=x86_64 -j4

      - name: Build engine (Windows, MSYS2 MINGW64)
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/quake3e"
          gcc --version
          # GCC 15 defaults to gnu23, which disagrees with mingw-w64 headers and
          # with this 1990s C codebase. Do not sed-patch system headers and do
          # not pass -fgnu89-inline: that combo #define'd inline to
          # `extern __inline__` and then failed on libvorbis `static inline`.
          mingw32-make ARCH=x86_64 PLATFORM=mingw64 -j4 \
            USE_CURL=0 USE_CURL_DLOPEN=0 \
            CFLAGS="-std=gnu11"

      - name: Build engine (macOS, universal)
        if: matrix.platform == 'macos'
        run: make -C /tmp/quake3e ARCH=universal -j4

      - name: Package engine (Linux)
        if: matrix.platform == 'linux'
        run: |
          mkdir -p dist/neonarena-engine/baseq3
          OUT=$(find /tmp/quake3e/build -type d -name "release-linux-x86_64" | head -1)
          [ -z "$OUT" ] && OUT=/tmp/quake3e/build/release-linux-x86_64
          cp "$OUT/quake3e.x64" dist/neonarena-engine/
          cp "$OUT/quake3e_opengl_x86_64.so" dist/neonarena-engine/ 2>/dev/null || true
          if [ -f "$OUT/quake3e_vulkan_x86_64.so" ]; then
            cp "$OUT/quake3e_vulkan_x86_64.so" dist/neonarena-engine/
          else
            echo "vulkan renderer not built - shipping OpenGL only"
          fi
          tar -czf dist/neonarena-engine-linux64.tar.gz -C dist neonarena-engine
          ls -la dist/neonarena-engine-linux64.tar.gz

      - name: Package engine (Windows)
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p dist/neonarena-engine/baseq3
          OUT=$(find "$GITHUB_WORKSPACE/quake3e/build" -type d -name "release*x86_64" | head -1)
          if [ -z "$OUT" ]; then
            OUT="$GITHUB_WORKSPACE/quake3e/build/release-mingw64-x86_64"
          fi
          echo "OUT=$OUT"
          ls -la "$OUT"
          # mingw build emits quake3e.x64.exe, not quake3e.exe
          if [ -f "$OUT/quake3e.x64.exe" ]; then
            cp "$OUT/quake3e.x64.exe" dist/neonarena-engine/quake3e.exe
          else
            cp "$OUT"/quake3e*.exe dist/neonarena-engine/
          fi
          cp "$OUT"/quake3e_opengl*.dll dist/neonarena-engine/ 2>/dev/null || true
          if ls "$OUT"/quake3e_vulkan*.dll >/dev/null 2>&1; then
            cp "$OUT"/quake3e_vulkan*.dll dist/neonarena-engine/
          else
            echo "vulkan renderer not built - shipping OpenGL only"
          fi
          # Prefer the SDL2 DLL the Makefile staged; fall back to MSYS2.
          cp "$OUT"/SDL*.dll dist/neonarena-engine/ 2>/dev/null || true
          if ! ls dist/neonarena-engine/SDL*.dll >/dev/null 2>&1; then
            cp /mingw64/bin/SDL2.dll dist/neonarena-engine/
          fi
          cd dist && zip -r neonarena-engine-win64.zip neonarena-engine
          ls -la neonarena-engine-win64.zip

      - name: Package engine (macOS, universal)
        if: matrix.platform == 'macos'
        run: |
          mkdir -p dist/neonarena-engine/baseq3
          OUT=$(find /tmp/quake3e/build -type d -name "release-darwin-universal" | head -1)
          if [ -z "$OUT" ]; then OUT=/tmp/quake3e/build/release-darwin-arm64; fi
          BINARY=$(find "$OUT" -maxdepth 1 -type f -name "quake3e*" | head -1)
          [ -z "$BINARY" ] && BINARY="$OUT/quake3e.universal"
          cp "$BINARY" dist/neonarena-engine/
          echo "Using engine binary: $BINARY"
          # copy renderer dylibs if present
          cp "$OUT/quake3e_opengl"*.dylib dist/neonarena-engine/ 2>/dev/null || true
          cp "$OUT/quake3e_vulkan"*.dylib dist/neonarena-engine/ 2>/dev/null || true
          if [ ! -f dist/neonarena-engine/quake3e_opengl*.dylib ] && [ ! -f dist/neonarena-engine/quake3e_vulkan*.dylib ]; then
            echo "no renderer dylib found - shipping engine binary only"
          fi
          tar -czf dist/neonarena-engine-macos-universal.tar.gz -C dist neonarena-engine
          ls -la dist/neonarena-engine-macos-universal.tar.gz

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neonarena-engine-${{ matrix.platform }}
          path: |
            dist/neonarena-engine-linux64.tar.gz
            dist/neonarena-engine-win64.zip
            dist/neonarena-engine-macos-universal.tar.gz

      - name: Release engine (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/neonarena-engine-linux64.tar.gz
            dist/neonarena-engine-win64.zip
            dist/neonarena-engine-macos-universal.tar.gz
