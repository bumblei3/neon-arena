name: build-mod

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# one run per ref: supersede in-progress runs on rapid pushes
concurrency:
  group: build-mod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          # oa-gamecode is pinned as a submodule; the checkout sha IS the version under test

      - name: Gamecode version under test
        run: |
          cd oa-gamecode
          echo "gamecode commit: $(git rev-parse HEAD)"
          git log --oneline -1
          grep GAMEVERSION code/game/g_local.h | head -2 >> "$GITHUB_STEP_SUMMARY"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex zip xvfb openarena x11-utils

      - name: Cache lcc toolchain + objects
        uses: actions/cache@v4
        with:
          path: oa-gamecode/build
          key: oa-build-${{ runner.os }}-${{ hashFiles('oa-gamecode/code/**/*.c', 'oa-gamecode/code/**/*.h', 'oa-gamecode/Makefile', 'Makefile.local') }}
          restore-keys: oa-build-${{ runner.os }}-

      - name: Build mod
        run: |
          cp Makefile.local oa-gamecode/
          make -C oa-gamecode

      - name: Verify artifacts
        run: |
          set -e
          OUT=oa-gamecode/build/release-linux-x86_64/neonarena
          ls -la "$OUT/vm/cgame.qvm" "$OUT/vm/qagame.qvm" "$OUT/vm/ui.qvm"
          # generic version check: extract GAMEVERSION from source and assert it is NeonArena-*
          V=$(grep -oP 'GAMEVERSION\s+\\"NeonArena-\K[0-9.]+' oa-gamecode/code/game/g_local.h | head -1)
          [ -n "$V" ] || { echo "GAMEVERSION not found"; exit 1; }
          echo "mod version: NeonArena-$V" >> "$GITHUB_STEP_SUMMARY"

      # ---- Headless test suite ----
      - name: Run headless test suite (tests/run_suite.sh)
        id: suite
        continue-on-error: true
        run: |
          set -e
          OUT=oa-gamecode/build/release-linux-x86_64/neonarena
          mkdir -p ~/.openarena/neonarena/vm
          cp "$OUT/vm/"*.qvm ~/.openarena/neonarena/vm/
          # QVMs must be inside a pk3: sv_pure rejects loose homepath VMs and
          # the client would fall back to vanilla stubs in baseoa (crash source)
          cd "$OUT" && zip -q ~/.openarena/neonarena/neonarena-qvm.pk3 vm/cgame.qvm vm/qagame.qvm vm/ui.qvm && cd - >/dev/null
          (cd assets && zip -rq ~/.openarena/neonarena/neon-look.pk3 scripts autoexec.cfg)
          chmod +x tests/run_suite.sh
          ./tests/run_suite.sh | tee /tmp/suite-output.txt
          exit "${PIPESTATUS[0]}"

      - name: Suite summary
        if: always()
        run: |
          if [ -f /tmp/suite-output.txt ]; then
            {
              echo "### Test suite"
              echo '```'
              cat /tmp/suite-output.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # fail the job if the suite failed
            grep -q "0 failed" /tmp/suite-output.txt || exit 1
          fi

      - name: Upload test logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: /tmp/nw-suite-*/test*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Package neonarena PK3
        run: |
          set -e
          OUT=oa-gamecode/build/release-linux-x86_64/neonarena
          mkdir -p dist/neonarena/vm
          cp "$OUT/vm/cgame.qvm" "$OUT/vm/qagame.qvm" "$OUT/vm/ui.qvm" dist/neonarena/vm/
          cp cgamex86_64.so qagamex86_64.so uix86_64.so dist/neonarena/ 2>/dev/null || true
          if [ -d "oa-gamecode/build/release-linux-x86_64/neonarena" ]; then
            cp oa-gamecode/build/release-linux-x86_64/neonarena/*.so dist/neonarena/ 2>/dev/null || true
          fi
          cd assets && mkdir -p ../dist/neonarena-zip-tmp && zip -rq ../dist/neonarena-zip-tmp/neon-look.pk3 scripts autoexec.cfg 2>/dev/null || (
            mkdir -p ../dist/pk3src && cp -r scripts autoexec.cfg ../dist/pk3src/
          )
          # pack look files into the same tree
          cd .. && cp -r assets/scripts dist/neonarena/ && cp assets/autoexec.cfg dist/neonarena/
          cd dist && zip -rq neonarena.pk3 neonarena && cd ..
          # standalone QVM pk3 for players who just drop a pk3 into ~/.openarena/neonarena/
          (cd oa-gamecode/build/release-linux-x86_64/neonarena && \
           zip -q "$GITHUB_WORKSPACE/dist/neonarena-qvm.pk3" vm/cgame.qvm vm/qagame.qvm vm/ui.qvm)
          ls -la dist/neonarena.pk3 dist/neonarena-qvm.pk3

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neonarena-mod
          path: |
            dist/neonarena.pk3
            dist/neonarena-qvm.pk3
            oa-gamecode/build/release-linux-x86_64/neonarena/vm/*.qvm

      # ---- Release on tag push ----
      - name: Create release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/neonarena.pk3
            dist/neonarena-qvm.pk3
          generate_release_notes: true
