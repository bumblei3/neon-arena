name: test-full

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: test-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install build dependencies
        run: |
          for i in 1 2 3; do
            sudo apt-get -o Acquire::Retries=5 update && \
            sudo apt-get -o Acquire::Retries=5 install -y build-essential bison flex zip xvfb openarena x11-utils && break
            echo "::warning::apt attempt $i failed, retrying"
            sleep $((i * 15))
          done

      - name: Cache QVMs
        uses: actions/cache@v6
        with:
          path: oa-gamecode/build/release-linux-x86_64/neonarena/vm
          key: qvm-v2-${{ runner.os }}-${{ hashFiles('oa-gamecode/code/**/*.c', 'oa-gamecode/code/**/*.h', 'oa-gamecode/Makefile', 'Makefile.local') }}

      - name: Build mod
        run: |
          cp Makefile.local oa-gamecode/
          make -C oa-gamecode

      - name: Install QVMs
        run: |
          set -e
          OUT=oa-gamecode/build/release-linux-x86_64/neonarena
          mkdir -p ~/.openarena/neonarena/vm
          test -f "$OUT/vm/cgame.qvm" && test -f "$OUT/vm/qagame.qvm" && test -f "$OUT/vm/ui.qvm"
          cp "$OUT/vm/"*.qvm ~/.openarena/neonarena/vm/
          (cd "$OUT" && zip -q ~/.openarena/neonarena/neonarena-qvm.pk3 vm/cgame.qvm vm/qagame.qvm vm/ui.qvm)
          (cd assets && zip -rq ~/.openarena/neonarena/neon-look.pk3 scripts textures gfx env sound autoexec.cfg ghost-binds.cfg neon-look.cfg neon-gfx.cfg gfx-auto.cfg && cp autoexec.cfg ghost-binds.cfg neon-look.cfg neon-gfx.cfg ~/.openarena/neonarena/)
          chmod +x tests/run_suite.sh

      - name: Run full test suite
        run: |
          set -e
          # Suite copies QVMs from ~/.openarena/neonarena into an isolated
          # homepath per test. A preset TEST_HOMEPATH is not the source.
          ./tests/run_suite.sh --parallel 4
