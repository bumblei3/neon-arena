name: build-installer

on:
  workflow_run:
    workflows: ["engine-quake3e"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download Engine Artifacts
        uses: actions/download-artifact@v7
        with:
          name: neonarena-engine-windows
          path: engine-zip
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id || github.run_id }}

      - name: Extract Engine
        run: |
          set -e
          mkdir -p installer/engine
          cd engine-zip
          unzip -q *.zip -d ../engine-extract
          cd ..
          # the engine artifact wraps its files in a neonarena-engine/ dir —
          # flatten so quake3e.exe sits directly in installer/engine/
          if [ -d engine-extract/neonarena-engine ]; then
            mv engine-extract/neonarena-engine/* installer/engine/
            rmdir engine-extract/neonarena-engine 2>/dev/null || true
          else
            mv engine-extract/* installer/engine/
          fi
          # baseq3 is unused — the engine is patched to BASEGAME=baseoa
          rmdir installer/engine/baseq3 2>/dev/null || true
          test -f installer/engine/quake3e.exe || { echo "quake3e.exe missing after extract"; exit 1; }
          ls -la installer/engine/

      - name: Fetch OpenArena base content
        run: |
          # The engine is patched with BASEGAME=baseoa — it loads maps and
          # textures from a baseoa\ folder next to the exe. Ship the OA
          # pak files (GPL content) so the portable zip is playable.
          sudo apt-get update -qq
          sudo apt-get install -y -qq openarena
          BASE=$(dpkg -L openarena 2>/dev/null | grep -m1 '/baseoa/pak0.pk3' | xargs dirname)
          [ -n "$BASE" ] || { echo "openarena baseoa not found"; exit 1; }
          echo "baseoa source: $BASE"
          mkdir -p installer/engine/baseoa
          cp "$BASE"/*.pk3 installer/engine/baseoa/
          ls -la installer/engine/baseoa/

      - name: Resolve version
        id: ver
        run: |
          V=$(grep -m1 'define[[:space:]]*GAMEVERSION' oa-gamecode/code/game/g_local.h \
              | sed -n 's/.*"NeonArena-\(.*\)".*/\1/p')
          [ -n "$V" ] || { echo "GAMEVERSION not found"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Mod version: NeonArena-$V"

      - name: Assemble portable package
        run: |
          set -e
          test -f dist/neonarena.pk3 && test -f dist/neonarena-qvm.pk3 && test -f dist/neon-look.pk3
          # fs_game=neonarena loads pk3s from neonarena\ next to the exe
          mkdir -p installer/engine/neonarena
          cp dist/neonarena.pk3 dist/neonarena-qvm.pk3 dist/neon-look.pk3 installer/engine/neonarena/
          cp installer/neonarena.bat installer/engine/
          cp README.md installer/engine/README.txt

      - name: Create Portable ZIP
        run: |
          cd installer/engine
          zip -r "../../NeonArena-${{ steps.ver.outputs.version }}-portable.zip" .
          ls -la "../../NeonArena-${{ steps.ver.outputs.version }}-portable.zip"

      - name: Verify package contents
        run: |
          set -e
          Z="NeonArena-${{ steps.ver.outputs.version }}-portable.zip"
          # unzip -l prints the filename at the END of each line — anchor there
          unzip -l "$Z" | grep -qE '(^|/)quake3e\.exe$'
          unzip -l "$Z" | grep -qE '(^|/)quake3e_opengl_x86_64\.dll$'
          unzip -l "$Z" | grep -qE '(^|/)quake3e_vulkan_x86_64\.dll$'
          unzip -l "$Z" | grep -qE '(^|/)SDL2.*\.dll$'
          unzip -l "$Z" | grep -qE '(^|/)neonarena/neonarena\.pk3$'
          unzip -l "$Z" | grep -qE '(^|/)neonarena/neonarena-qvm\.pk3$'
          unzip -l "$Z" | grep -qE '(^|/)neonarena/neon-look\.pk3$'
          unzip -l "$Z" | grep -qE '(^|/)neonarena\.bat$'
          unzip -l "$Z" | grep -qE '(^|/)baseoa/pak.*\.pk3$'
          echo "portable package layout verified"

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: neonarena-installer
          path: NeonArena-${{ steps.ver.outputs.version }}-portable.zip

      # workflow_run github.ref is the default branch, never a tag — do not
      # attach this zip to a GitHub Release here. Tag releases come from build-mod.
