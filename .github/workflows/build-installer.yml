name: build-installer

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Engine Artifacts
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: engine-quake3e.yml
          workflow_conclusion: success
          branch: main
          name: neonarena-engine-windows
          path: engine-zip

      - name: Extract Engine
        run: |
          cd engine-zip
          unzip -q *.zip -d ../installer/engine

      - name: Copy Mod Files
        run: |
          cp dist/neonarena.pk3 installer/engine/
          cp dist/neonarena-qvm.pk3 installer/engine/
          cp dist/neon-look.pk3 installer/engine/

      - name: Create Portable ZIP
        run: |
          cd installer/engine
          zip -r ../../NeonArena-0.53-portable.zip .
          ls -la ../../NeonArena-0.53-portable.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: neonarena-installer
          path: NeonArena-0.53-portable.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: NeonArena-0.53-portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
