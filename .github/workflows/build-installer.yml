name: build-installer

on:
  workflow_run:
    workflows: ["engine-quake3e"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download Engine Artifacts
        uses: actions/download-artifact@v4
        with:
          name: neonarena-engine-windows
          path: engine-zip
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id || github.run_id }}

      - name: Extract Engine
        run: |
          cd engine-zip
          unzip -q *.zip -d ../installer/engine

      - name: Copy Mod Files
        run: |
          cp dist/neonarena.pk3 installer/engine/
          cp dist/neonarena-qvm.pk3 installer/engine/
          cp dist/neon-look.pk3 installer/engine/

      - name: Create Portable ZIP
        run: |
          cd installer/engine
          zip -r ../../NeonArena-portable.zip .
          ls -la ../../NeonArena-portable.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: neonarena-installer
          path: NeonArena-portable.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: NeonArena-portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
