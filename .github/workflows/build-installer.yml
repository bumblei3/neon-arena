name: build-installer

on:
  workflow_run:
    workflows: ["engine-quake3e"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download Engine Artifacts
        uses: actions/download-artifact@v7
        with:
          name: neonarena-engine-windows
          path: engine-zip
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id || github.run_id }}

      - name: Extract Engine
        run: |
          cd engine-zip
          unzip -q *.zip -d ../installer/engine

      - name: Resolve version
        id: ver
        run: |
          V=$(grep -m1 'define[[:space:]]*GAMEVERSION' oa-gamecode/code/game/g_local.h \
              | sed -n 's/.*"NeonArena-\(.*\)".*/\1/p')
          [ -n "$V" ] || { echo "GAMEVERSION not found"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Mod version: NeonArena-$V"

      - name: Copy Mod Files
        run: |
          test -f dist/neonarena.pk3 && test -f dist/neonarena-qvm.pk3 && test -f dist/neon-look.pk3
          cp dist/neonarena.pk3 dist/neonarena-qvm.pk3 dist/neon-look.pk3 installer/engine/

      - name: Create Portable ZIP
        run: |
          cd installer/engine
          zip -r "../../NeonArena-${{ steps.ver.outputs.version }}-portable.zip" .
          ls -la "../../NeonArena-${{ steps.ver.outputs.version }}-portable.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: neonarena-installer
          path: NeonArena-${{ steps.ver.outputs.version }}-portable.zip

      # workflow_run github.ref is the default branch, never a tag — do not
      # attach this zip to a GitHub Release here. Tag releases come from build-mod.
